name: KISA Guideline Bot

on:
  schedule:
    - cron: '0 22 * * *'    # 한국 시간 오전 7시 00분
    - cron: '30 0 * * *'    # 한국 시간 오전 9시 30분
    - cron: '0 5 * * *'     # 한국 시간 오후 2시 00분
    - cron: '0 8 * * *'     # 한국 시간 오후 5시 00분
  workflow_dispatch:        # 수동 실행 버튼 유지

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3
      
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: KISA 봇 스크립트 실행
      env:
        KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      run: python main.py
      
    - name: 중복 방지 기록 업데이트 (GitHub에 덮어쓰기)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add last_kisa_post.txt last_news_post.txt last_pipc_post.txt alert_history.txt
        git commit -m "Update post records and history" || echo "No changes to commit"
        git push
